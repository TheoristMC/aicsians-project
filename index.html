<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AICSians</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <main>
      <h1>STUDENT INFORMATION</h1>
      <form id="search-container">
        <h3>Search a student</h3>
        <input type="text" id="search" maxlength="6" name="search" />
      </form>
      <button id="scan-qr">Scan QR</button>
      <div id="qr-reader" style="max-width: 400px"></div>
      <h1>Student Name</h1>
      <p id="student-name">???</p>
      <h1>Student ID</h1>
      <p id="student-id">???</p>
      <h1>Learner's Reference Number</h1>
      <p id="student-lrn">???</p>
      <h1>Phone Number</h1>
      <p id="student-tel">???</p>
      <h1>Guardian's Name</h1>
      <p id="student-guardian">???</p>
      <h1>Guardian's Phone Number</h1>
      <p id="student-guardian-tel">???</p>
      <h1>Home Address</h1>
      <p id="student-address">???</p>
      <p id="error-message"></p>
      <div id="qr-code">
        <button id="qr-code-button-download">Download QR</button>
      </div>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
